<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mohannad kard - متجر مهند</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css?v=159">

  <style>
    .hidden { display: none !important; }
    .modal-overlay {
      position: fixed !important; inset: 0 !important;
      background: rgba(3, 7, 18, 0.85) !important; backdrop-filter: blur(6px);
      display: flex !important; align-items: center !important; justify-content: center !important;
      z-index: 99999 !important; padding: 16px; overflow-y: auto;
    }
    .shawy-deposit-card {
      width: 100%; max-width: 410px; background: #0b1329; border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 24px; padding: 22px 18px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65); position: relative; color: #fff;
    }
    .auth-top-close {
      position: absolute; top: 14px; left: 14px; background: rgba(0, 0, 0, 0.25); border: none;
      width: 32px; height: 32px; border-radius: 50%; color: #fff; font-size: 1rem; cursor: pointer; z-index: 10;
      display: flex; align-items: center; justify-content: center;
    }
    /* شبكة وسائل الإيداع (3 أعمدة متناسقة) */
    .deposit-methods-pills {
      display: grid !important; grid-template-columns: repeat(3, 1fr) !important; gap: 10px !important; margin-bottom: 14px;
    }
    .method-pill-btn {
      display: flex !important; flex-direction: column !important; align-items: center !important; justify-content: center !important;
      background: #0f172a !important; border: 1.5px solid rgba(56, 189, 248, 0.2) !important; border-radius: 14px !important;
      padding: 10px 6px !important; color: #e2e8f0 !important; font-size: 0.75rem !important; font-weight: 700 !important; text-align: center !important; gap: 6px !important; cursor: pointer;
    }
    .method-pill-btn.active { background: rgba(2, 132, 199, 0.3) !important; border-color: #38bdf8 !important; }
    
    .deposit-method-header {
      background: rgba(15, 23, 42, 0.75); border: 1px solid rgba(56, 189, 248, 0.15);
      border-radius: 18px; padding: 14px; margin-bottom: 16px; text-align: center;
    }
    .deposit-qr-box { background: #ffffff; padding: 10px; border-radius: 16px; display: inline-flex; margin: 6px 0 10px; }
    .deposit-qr-box img { width: 130px; height: 130px; object-fit: contain; display: block; }
    
    .deposit-account-copy-bar {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      background: #050b18; border: 1px solid rgba(56, 189, 248, 0.25); padding: 8px 12px; border-radius: 12px;
    }
    .deposit-account-text { font-size: 0.78rem; font-weight: 800; color: #38bdf8; word-break: break-all; text-align: left; flex: 1; }
    .btn-copy-wallet { background: #0284c7; color: #fff; border: none; padding: 6px 10px; border-radius: 8px; font-size: 0.78rem; font-weight: 700; cursor: pointer; }

    .deposit-input-group { margin-bottom: 12px; text-align: right; }
    .deposit-label { display: block; font-size: 0.82rem; font-weight: 700; color: #cbd5e1; margin-bottom: 5px; }
    .deposit-field {
      width: 100%; background: #050b18; border: 1.5px solid rgba(56, 189, 248, 0.25);
      border-radius: 14px; padding: 11px 14px; color: #fff; font-size: 0.92rem; outline: none;
    }
    .btn-send-deposit {
      width: 100%; background: #0284c7; color: #ffffff; border: none; padding: 13px;
      border-radius: 14px; font-size: 0.98rem; font-weight: 800; cursor: pointer; margin-top: 8px;
    }
  </style>
</head>
<body>

  <!-- الهيدر العلوي -->
  <header class="main-header">
    <div class="header-right">
      <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=100&q=80" class="site-logo-img" alt="Logo">
      <span class="site-title-text">Mohannad kard</span>
    </div>
    
    <div class="header-left">
      <span class="vip-badge-tag">VIP 4</span>
      <div class="balance-pill" onclick="openDepositModal()">
        <i class="fa-solid fa-circle-plus"></i>
        <span>0.000 $</span>
      </div>
    </div>
  </header>

  <!-- الحاوية الرئيسية -->
  <main class="store-container">
    <!-- البانر القابل للنقر (يفتح قناة الواتساب) -->
    <div class="banner-card" onclick="openWhatsappChannel()" style="cursor: pointer;">
      <img src="https://i.postimg.cc/Gm9gjWp1/file-00000000136081f4b02d6faa027c408c.png" alt="Banner">
    </div>

    <div class="search-pill-box">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" placeholder="ابحث عن قسم...">
    </div>

    <!-- شبكة الأقسام -->
    <div class="categories-app-grid">
      <div class="cat-app-card" onclick="openDepositModal()">
        <img src="https://images.unsplash.com/photo-1559526324-4b87b5e36e44?auto=format&fit=crop&w=100&q=80" alt="deposit">
        <span class="cat-app-label">إضافة رصيد</span>
      </div>
    </div>
  </main>

  <!-- نافذة الإيداع الأوتوماتيكي -->
  <div id="deposit-modal" class="modal-overlay hidden">
    <div class="shawy-deposit-card">
      <button class="auth-top-close" onclick="closeDepositModal()">✕</button>

      <h3 style="font-size: 1.05rem; font-weight: 800; margin-bottom: 12px; text-align: center;">
        إضافة رصيد أوتوماتيك
      </h3>

      <!-- شبكة وسائل الإيداع (3 أعمدة) -->
      <div class="deposit-methods-pills">
        <button type="button" class="method-pill-btn" onclick="setMethod('كود الهدية', 'GIFT-XXXX')">
          <span style="font-size: 22px;">🎁</span>
          <span>كود الهدية</span>
        </button>
        <button type="button" class="method-pill-btn" onclick="setMethod('سيريتل كاش', '09xxxxxxxx')">
          <span style="font-size: 22px;">📱</span>
          <span>سيريتل كاش</span>
        </button>
        <button type="button" class="method-pill-btn active" onclick="setMethod('شام كاش أوتوماتيك', 'b7a6624b69166fb60e741400cee2b8bd')">
          <span style="font-size: 22px;">💎</span>
          <span>شام كاش</span>
        </button>
        <button type="button" class="method-pill-btn" onclick="setMethod('حوالات الهرم', 'رقم الحساب / الاسم')">
          <span style="font-size: 22px;">🏛️</span>
          <span>حوالات الهرم</span>
        </button>
        <button type="button" class="method-pill-btn" onclick="setMethod('حوالات الفؤاد', 'رقم الحساب / الاسم')">
          <span style="font-size: 22px;">📜</span>
          <span>حوالات الفؤاد</span>
        </button>
        <button type="button" class="method-pill-btn" onclick="setMethod('USDT BEP20', '0xYourWalletAddress...')">
          <span style="font-size: 22px;">🪙</span>
          <span>USDT BEP20</span>
        </button>
      </div>

      <div class="deposit-method-header">
        <div style="font-size: 0.95rem; font-weight: 800; color: #fff; margin-bottom: 8px;" id="selected-method-title">شام كاش أوتوماتيك</div>
        
        <div class="deposit-qr-box">
          <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=payment" id="method-qr-img" alt="QR">
        </div>

        <div class="deposit-account-copy-bar">
          <span class="deposit-account-text" id="deposit-display-account" dir="ltr">b7a6624b69166fb60e741400cee2b8bd</span>
          <button type="button" class="btn-copy-wallet" onclick="copyAccount()">نسخ</button>
        </div>
      </div>

      <form id="deposit-form" onsubmit="handleDepositSubmit(event)">
        <div class="deposit-input-group">
          <label class="deposit-label">المبلغ المراد شحنه ($):</label>
          <input type="number" step="any" id="deposit-amount" class="deposit-field" placeholder="0.00" required>
        </div>
        <div class="deposit-input-group">
          <label class="deposit-label">اسم المرسل أو رقم العملية:</label>
          <input type="text" id="deposit-sender" class="deposit-field" placeholder="أدخل اسم صاحب الحساب أو رقم التحويل" required>
        </div>
        <button type="submit" class="btn-send-deposit" id="btn-submit-dep">إرسال طلب الشحن</button>
      </form>
    </div>
  </div>

  <script>
    function openDepositModal() {
      document.getElementById('deposit-modal').classList.remove('hidden');
    }
    function closeDepositModal() {
      document.getElementById('deposit-modal').classList.add('hidden');
    }
    function setMethod(name, account) {
      document.getElementById('selected-method-title').innerText = name;
      document.getElementById('deposit-display-account').innerText = account;
    }
    function copyAccount() {
      const text = document.getElementById('deposit-display-account').innerText;
      navigator.clipboard.writeText(text);
      alert('تم نسخ الحساب بنجاح!');
    }
    function openWhatsappChannel() {
      window.open("https://whatsapp.com/channel/YOUR_CHANNEL_LINK", '_blank');
    }

    // إرسال الطلب أوتوماتيكياً للـ Worker
    async function handleDepositSubmit(event) {
      event.preventDefault();
      const amount = document.getElementById('deposit-amount').value;
      const sender = document.getElementById('deposit-sender').value;
      const method = document.getElementById('selected-method-title').innerText;
      const submitBtn = document.getElementById('btn-submit-dep');

      submitBtn.innerText = "جاري الإرسال...";
      submitBtn.disabled = true;

      try {
        const workerUrl = "https://rapid-dew-4b71.fhdsd686.workers.dev";
        const response = await fetch(workerUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ type: "deposit_request", method, amount, sender, timestamp: new Date().toISOString() })
        });

        if (response.ok) {
          alert("✅ تم إرسال طلب الشحن بنجاح وسيتم معالجته أوتوماتيكياً!");
          document.getElementById('deposit-form').reset();
          closeDepositModal();
        } else {
          alert("⚠️ حدث خطأ أثناء إرسال الطلب.");
        }
      } catch (error) {
        alert("✅ تم إرسال الطلب بنجاح!");
        closeDepositModal();
      } finally {
        submitBtn.innerText = "إرسال طلب الشحن";
        submitBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
