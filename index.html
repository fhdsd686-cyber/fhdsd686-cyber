<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>متجر الخدمات الرقمية</title>
  
  <!-- مكتبة الأيقونات Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg-dark: #0f172a;
      --bg-card: #1e293b;
      --bg-input: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #06b6d4;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --border-color: #334155;
      --radius: 12px;
      --transition: all 0.25s ease;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    /* شريط التنقل العلوي */
    .navbar {
      background-color: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 1000;
      padding: 0.85rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: var(--transition);
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: var(--text-main);
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .brand-logo i {
      color: var(--primary);
      font-size: 1.5rem;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    /* الأزرار وتنسيقات عناصر الإدخال */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.55rem 1.15rem;
      border-radius: var(--radius);
      font-size: 0.9rem;
      font-weight: 600;
      border: 1px solid transparent;
      cursor: pointer;
      transition: var(--transition);
      text-decoration: none;
    }

    .btn-primary {
      background-color: var(--primary);
      color: #ffffff;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
      transform: translateY(-1px);
    }

    .btn-outline {
      background-color: transparent;
      border-color: var(--border-color);
      color: var(--text-main);
    }

    .btn-outline:hover {
      background-color: var(--bg-card);
      border-color: var(--text-muted);
    }

    .btn-success {
      background-color: var(--success);
      color: #ffffff;
    }

    .btn-danger {
      background-color: var(--danger);
      color: #ffffff;
    }

    .btn-sm {
      padding: 0.35rem 0.75rem;
      font-size: 0.8rem;
    }

    .form-group {
      margin-bottom: 1.15rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .form-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .form-control {
      width: 100%;
      padding: 0.65rem 0.9rem;
      background-color: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      color: var(--text-main);
      font-size: 0.9rem;
      outline: none;
      transition: var(--transition);
    }

    .form-control:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.25);
    }
    /* الحاوية والواجهة الرئيسية */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1.5rem 1rem;
      width: 100%;
    }

    /* البانر الترحيبي (Hero Section) */
    .hero-banner {
      background: linear-gradient(135deg, rgba(79, 70, 229, 0.2) 0%, rgba(6, 182, 212, 0.1) 100%);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 2.5rem 1.5rem;
      text-align: center;
      margin-bottom: 2rem;
      position: relative;
      overflow: hidden;
    }

    .hero-title {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 0.75rem;
      background: linear-gradient(to right, #ffffff, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-desc {
      color: var(--text-muted);
      font-size: 1rem;
      max-width: 600px;
      margin: 0 auto 1.5rem;
      line-height: 1.6;
    }

    /* شريط تصفية التصنيفات (Categories Filter) */
    .categories-bar {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      overflow-x: auto;
      padding-bottom: 0.5rem;
      margin-bottom: 1.75rem;
      scrollbar-width: none;
    }

    .categories-bar::-webkit-scrollbar {
      display: none;
    }

    .category-chip {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 0.45rem 1.1rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: var(--transition);
    }

    .category-chip:hover,
    .category-chip.active {
      background-color: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
    }
    /* شبكة المنتجات (Products Grid) */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.5rem;
      margin-bottom: 3rem;
    }

    /* بطاقة المنتج (Product Card) */
    .product-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: var(--transition);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .product-card:hover {
      transform: translateY(-4px);
      border-color: var(--primary);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.25);
    }

    .product-img-wrapper {
      width: 100%;
      height: 180px;
      background-color: var(--bg-input);
      position: relative;
      overflow: hidden;
    }

    .product-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: var(--transition);
    }

    .product-card:hover .product-img {
      transform: scale(1.05);
    }

    .product-badge {
      position: absolute;
      top: 0.75rem;
      right: 0.75rem;
      background-color: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(4px);
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--accent);
      border: 1px solid var(--border-color);
    }

    .product-info {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .product-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: var(--text-main);
    }

    .product-desc {
      color: var(--text-muted);
      font-size: 0.85rem;
      line-height: 1.5;
      margin-bottom: 1rem;
      flex-grow: 1;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .product-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border-color);
      margin-top: auto;
    }

    .product-price {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--success);
    }
    /* لوحة تحكم الأدمن (Admin Dashboard) */
    .admin-container {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      margin-bottom: 2rem;
      overflow: hidden;
      display: none;
    }

    .admin-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.4);
    }

    .admin-nav {
      display: flex;
      gap: 0.5rem;
      border-bottom: 1px solid var(--border-color);
      padding: 0.5rem 1.5rem;
      overflow-x: auto;
      background: rgba(15, 23, 42, 0.2);
    }

    .admin-nav-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0.5rem 1rem;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: var(--radius);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: var(--transition);
      white-space: nowrap;
    }

    .admin-nav-btn:hover,
    .admin-nav-btn.active {
      color: var(--text-main);
      background-color: var(--bg-input);
    }

    .admin-nav-btn.active {
      color: var(--primary);
    }

    .admin-content {
      padding: 1.5rem;
    }

    .admin-tab {
      display: none;
    }

    .admin-tab.active {
      display: block;
    }
    /* شبكة بطاقات الإحصائيات (Stats Grid) */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .stat-card {
      background-color: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .stat-card-title {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .stat-card-value {
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--text-main);
    }

    /* الجداول العامة للبيانات (Data Tables) */
    .table-container {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      background-color: var(--bg-input);
    }

    .custom-table {
      width: 100%;
      border-collapse: collapse;
      text-align: right;
      font-size: 0.9rem;
    }

    .custom-table th,
    .custom-table td {
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--border-color);
      white-space: nowrap;
    }

    .custom-table th {
      background-color: rgba(15, 23, 42, 0.4);
      color: var(--text-muted);
      font-weight: 700;
    }

    .custom-table tr:hover td {
      background-color: rgba(255, 255, 255, 0.02);
    }

    .badge-status {
      display: inline-block;
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .badge-pending {
      background-color: rgba(245, 158, 11, 0.15);
      color: var(--warning);
      border: 1px solid var(--warning);
    }

    .badge-completed {
      background-color: rgba(16, 185, 129, 0.15);
      color: var(--success);
      border: 1px solid var(--success);
    }

    .badge-rejected {
      background-color: rgba(239, 68, 68, 0.15);
      color: var(--danger);
      border: 1px solid var(--danger);
    }
    /* النوافذ المنبثقة (Modals) */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      padding: 1rem;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-box {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 1.75rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    .modal-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* إشعارات التنبيه السريعة (Toast Notifications) */
    .toast-container {
      position: fixed;
      bottom: 1.5rem;
      left: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      z-index: 9999;
      pointer-events: none;
    }

    .toast {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 0.85rem 1.25rem;
      color: var(--text-main);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.9rem;
      min-width: 250px;
      animation: slideIn 0.3s ease;
      pointer-events: auto;
    }

    @keyframes slideIn {
      from {
        transform: translateY(20px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }
    /* تحسينات الاستجابة للشاشات الصغيرة */
    @media (max-width: 640px) {
      .hero-title {
        font-size: 1.5rem;
      }
      .products-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- شريط التنقل العلوي (Navbar) -->
  <nav class="navbar">
    <a href="#" class="brand-logo" onclick="location.reload(); return false;">
      <i class="fa-solid fa-store"></i>
      <span>متجر الخدمات</span>
    </a>

    <div class="nav-actions">
      <!-- أزرار وواجهة المستخدم الضيف -->
      <div id="guestActions" style="display: flex; gap: 0.5rem;">
        <button class="btn btn-outline btn-sm" onclick="openModal('authModal')">
          <i class="fa-solid fa-right-to-bracket"></i>
          <span>دخول / تسجيل</span>
        </button>
      </div>

      <!-- واجهة المستخدم المسجل -->
      <div id="userActions" style="display: none; align-items: center; gap: 0.75rem;">
        <div style="display: flex; align-items: center; gap: 0.4rem; background: var(--bg-card); padding: 0.35rem 0.75rem; border-radius: 9999px; border: 1px solid var(--border-color); font-size: 0.85rem;">
          <i class="fa-solid fa-wallet" style="color: var(--accent);"></i>
          <span style="color: var(--text-muted);">الرصيد:</span>
          <strong id="navUserBalance" style="color: var(--success);">0.00</strong>
          <span style="font-size: 0.75rem;">$</span>
          <button class="btn btn-primary btn-sm" style="padding: 0.15rem 0.5rem; margin-right: 0.25rem; font-size: 0.75rem;" onclick="openModal('depositModal')">
            <i class="fa-solid fa-plus"></i> شحن
          </button>
        </div>

        <button id="adminPanelBtn" class="btn btn-outline btn-sm" style="display: none;" onclick="toggleAdminView()">
          <i class="fa-solid fa-shield-halved"></i>
          <span>لوحة التحكم</span>
        </button>

        <button class="btn btn-danger btn-sm" onclick="handleLogout()" title="تسجيل الخروج">
          <i class="fa-solid fa-arrow-right-from-bracket"></i>
        </button>
      </div>
    </div>
  </nav>
  <!-- الحاوية الرئيسية للمحتوى -->
  <main class="container">

    <!-- البانر الترحيبي (Hero Section) -->
    <section class="hero-banner">
      <h1 class="hero-title">أهلاً بك في متجر الخدمات الرقمية</h1>
      <p class="hero-desc">وجهتك المثالية للحصول على الاشتراكات والبطاقات والخدمات التقنية المتميزة بأسرع وقت وأفضل الأسعار وبشكل آلي ومباشر.</p>
      <div style="display: flex; justify-content: center; gap: 0.75rem; flex-wrap: wrap;">
        <span style="display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.85rem; color: var(--accent);">
          <i class="fa-solid fa-bolt"></i> تسليم فوري وتلقائي
        </span>
        <span style="display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.85rem; color: var(--success); margin-right: 1rem;">
          <i class="fa-solid fa-shield-check"></i> ضمان وحماية كاملة
        </span>
      </div>
    </section>

    <!-- شريط تصفية وتصنيفات المنتجات -->
    <section class="categories-bar" id="categoriesBar">
      <button class="category-chip active" onclick="filterByCategory('all')">
        <i class="fa-solid fa-border-all"></i> الكل
      </button>
      <!-- سيتم توليد أزرار التصنيفات ديناميكياً هنا عبر الجافاسكريبت -->
    </section>
