  <!-- نافذة تسجيل الدخول وإنشاء الحساب بنمط Shawy Card الحديث -->
  <div id="auth-modal" class="modal-overlay hidden">
    <div class="shawy-auth-card">
      <button class="auth-top-close" onclick="closeAuthModal()">✕</button>
      
      <!-- الهيدر الأزرق المنحني -->
      <div class="auth-blue-header">
        <div class="auth-header-circle">
          <i class="fa-solid fa-arrow-right-to-bracket" id="auth-header-icon"></i>
        </div>
        <h2 id="auth-banner-title">أهلاً بعودتك</h2>
        <p id="auth-banner-desc">سجّل دخولك للوصول إلى حسابك وخدماتك</p>
      </div>

      <!-- محتوى النموذج الأبيض -->
      <div class="auth-body-content">
        <h3 class="auth-main-title" id="auth-form-title">تسجيل الدخول</h3>
        <p class="auth-sub-title" id="auth-form-subtitle">مرحباً بك مجدداً!</p>

        <form onsubmit="handleAuthSubmit(event)">
          <!-- حقل الاسم (يظهر فقط في إنشاء الحساب) -->
          <div class="shawy-input-group hidden" id="group-signup-name">
            <label>الاسم الكامل</label>
            <div class="input-with-icon">
              <input type="text" id="auth-fullname" placeholder="أدخل اسمك الكامل">
              <i class="fa-regular fa-id-card"></i>
            </div>
          </div>

          <!-- حقل اسم المستخدم -->
          <div class="shawy-input-group">
            <label>اسم المستخدم</label>
            <div class="input-with-icon">
              <input type="text" id="auth-identifier" required placeholder="أدخل اسم المستخدم">
              <i class="fa-regular fa-user"></i>
            </div>
          </div>

          <!-- حقل كلمة المرور -->
          <div class="shawy-input-group">
            <label>كلمة المرور</label>
            <div class="input-with-icon">
              <input type="password" id="auth-password" required placeholder="••••••••">
              <i class="fa-solid fa-lock"></i>
            </div>
          </div>

          <button type="submit" class="btn-shawy-auth" id="auth-action-btn">
            تسجيل الدخول
          </button>
        </form>

        <!-- زر التبديل بين تسجيل الدخول وإنشاء حساب جديد -->
        <div class="auth-switch-box">
          <span id="auth-switch-text">ليس لديك حساب؟</span>
          <button type="button" class="btn-text-link" onclick="toggleAuthMode()" id="auth-switch-btn">
            إنشاء حساب جديد
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- نافذة تأكيد تسجيل الخروج المنبثقة -->
  <div id="logout-confirm-modal" class="modal-overlay hidden">
    <div class="shawy-logout-card">
      <div class="logout-icon-circle">
        <i class="fa-solid fa-arrow-right-from-bracket"></i>
      </div>
      <h3 class="logout-title">تسجيل الخروج</h3>
      <p class="logout-desc">هل أنت متأكد من تسجيل الخروج من حسابك؟</p>
      
      <div class="logout-actions-row">
        <button class="btn-logout-confirm" onclick="confirmLogoutAction()">تأكيد</button>
        <button class="btn-logout-cancel" onclick="closeLogoutModal()">إلغاء</button>
      </div>
    </div>
  </div>
