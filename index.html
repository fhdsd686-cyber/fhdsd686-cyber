<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مركز مهند للتكنولوجيا | شحن فوري وخدمات إلكترونية</title>

  <!-- أيقونات Font Awesome الرسمية -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- خط تجوال من Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">

  <!-- مكتبة Supabase CDN الرسمية -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --accent: #8b5cf6;
      --accent-hover: #7c3aed;
      --bg-main: #0b0f19;
      --bg-card: #111827;
      --bg-card-hover: #1f2937;
      --border-color: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --success: #10b981;
      --warning: #f59e0b;
      --font-family: 'Tajawal', sans-serif;
      --radius-md: 10px;
      --radius-lg: 16px;
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    [data-theme="light"] {
      --bg-main: #f1f5f9;
      --bg-card: #ffffff;
      --bg-card-hover: #f8fafc;
      --border-color: #cbd5e1;
      --text-main: #0f172a;
      --text-muted: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-family);
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      width: 100%;
      overflow-x: hidden;
      transition: var(--transition);
    }

    /* شريط التمرير */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-main);
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
    /* شريط التنقل ورأس الصفحة */
    header {
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 1000;
      border-bottom: 1px solid var(--border-color);
      padding: 0.8rem 1rem;
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      cursor: pointer;
      user-select: none;
    }

    .brand-logo {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      object-fit: cover;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1.25rem;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }

    .brand-info h1 {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1.2;
    }

    .brand-info span {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .balance-badge {
      background: rgba(37, 99, 235, 0.15);
      border: 1px solid rgba(37, 99, 235, 0.3);
      padding: 0.4rem 0.8rem;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 700;
      color: #60a5fa;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .action-btn {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition);
      font-size: 0.95rem;
    }

    .action-btn:hover {
      background: var(--bg-card-hover);
      border-color: var(--primary);
    }

    /* منطقة البحث والتصنيفات */
    .hero-search {
      max-width: 1200px;
      margin: 1.5rem auto 1rem;
      padding: 0 1rem;
    }

    .search-box {
      position: relative;
      width: 100%;
    }

    .search-box i {
      position: absolute;
      right: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    .search-input {
      width: 100%;
      padding: 0.85rem 2.8rem 0.85rem 1rem;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: var(--transition);
    }

    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
    }

    .categories-bar {
      display: flex;
      gap: 0.6rem;
      overflow-x: auto;
      padding: 0.5rem 1rem 1rem;
      max-width: 1200px;
      margin: 0 auto;
      scrollbar-width: none;
    }

    .categories-bar::-webkit-scrollbar {
      display: none;
    }

    .cat-pill {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 0.5rem 1rem;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .cat-pill.active, .cat-pill:hover {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    /* شبكة عرض المنتجات */
    .services-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.25rem;
    }

    .service-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: var(--transition);
      position: relative;
    }

    .service-card:hover {
      transform: translateY(-4px);
      border-color: var(--primary);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }

    .card-img-wrapper {
      position: relative;
      width: 100%;
      height: 150px;
      background: #1e293b;
      overflow: hidden;
    }

    .card-img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .service-card:hover .card-img-wrapper img {
      transform: scale(1.05);
    }

    .card-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      font-size: 0.7rem;
      font-weight: 700;
      color: #38bdf8;
    }

    .card-body {
      padding: 1rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 0.4rem;
      color: var(--text-main);
    }

    .card-desc {
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.4;
      margin-bottom: 1rem;
      flex-grow: 1;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-btn {
      width: 100%;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #fff;
      border: none;
      padding: 0.65rem;
      border-radius: var(--radius-md);
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: var(--transition);
    }

    .card-btn:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }
    /* خلفية النوافذ المنبثقة */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      padding: 1rem;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-box {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 460px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 1.5rem;
      position: relative;
      box-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.6);
      animation: modalFadeIn 0.25s ease-out;
    }

    @keyframes modalFadeIn {
      from {
        opacity: 0;
        transform: scale(0.95);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.25rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.75rem;
    }

    .modal-header h3 {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .close-modal-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.2rem;
      cursor: pointer;
      transition: var(--transition);
    }

    .close-modal-btn:hover {
      color: var(--danger);
    }

    /* نماذج الإدخال داخل النوافذ */
    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
    }

    .form-input, .form-select, .form-textarea {
      width: 100%;
      padding: 0.75rem 1rem;
      background: var(--bg-main);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      color: var(--text-main);
      font-size: 0.9rem;
      outline: none;
      transition: var(--transition);
    }

    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
    }

    .form-textarea {
      resize: vertical;
      min-height: 80px;
    }

    .modal-submit-btn {
      width: 100%;
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 0.8rem;
      border-radius: var(--radius-md);
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: var(--transition);
      margin-top: 0.5rem;
    }

    .modal-submit-btn:hover {
      background: var(--primary-hover);
    }

    /* نظام التنبيهات Toast */
    #toastContainer {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      z-index: 3000;
      pointer-events: none;
    }

    .toast {
      min-width: 250px;
      max-width: 320px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 0.8rem 1.2rem;
      border-radius: var(--radius-md);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      color: var(--text-main);
      font-size: 0.85rem;
      font-weight: 600;
      pointer-events: auto;
      animation: slideInRight 0.3s ease-out forwards;
    }

    .toast.success { border-right: 4px solid var(--success); }
    .toast.error { border-right: 4px solid var(--danger); }
    .toast.info { border-right: 4px solid var(--primary); }

    @keyframes slideInRight {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    /* اللوحة الجانبية للإدارة (Admin Drawer) */
    .admin-drawer {
      position: fixed;
      top: 0;
      right: -100%;
      width: 100%;
      max-width: 480px;
      height: 100vh;
      background: var(--bg-card);
      border-left: 1px solid var(--border-color);
      z-index: 2500;
      transition: right 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      box-shadow: -10px 0 30px rgba(0, 0, 0, 0.6);
    }

    .admin-drawer.open {
      right: 0;
    }

    .admin-drawer-header {
      padding: 1.25rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 23, 42, 0.6);
    }

    .admin-header-title {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .admin-logo-wrapper {
      position: relative;
      width: 46px;
      height: 46px;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid var(--primary);
    }

    .admin-logo-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* زر تغيير صورة لوحة الأدمن */
    .change-logo-btn {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      font-size: 0.65rem;
      text-align: center;
      padding: 2px 0;
      cursor: pointer;
      border: none;
      transition: var(--transition);
    }

    .change-logo-btn:hover {
      background: var(--primary);
    }

    .close-drawer-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.3rem;
      cursor: pointer;
      transition: var(--transition);
    }

    .close-drawer-btn:hover {
      color: var(--danger);
    }

    /* شريط التبويبات والتنقل للأقسام الـ 10 */
    .admin-nav-tabs {
      display: flex;
      overflow-x: auto;
      background: var(--bg-main);
      border-bottom: 1px solid var(--border-color);
      padding: 0.5rem;
      gap: 0.4rem;
      scrollbar-width: none;
    }

    .admin-nav-tabs::-webkit-scrollbar {
      display: none;
    }

    .admin-tab-btn {
      padding: 0.5rem 0.85rem;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      border-radius: var(--radius-md);
      font-size: 0.8rem;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .admin-tab-btn.active, .admin-tab-btn:hover {
      background: var(--bg-card);
      color: var(--primary);
      border-color: var(--border-color);
    }

    /* جسم ومحتوى أقسام لوحة الإدارة */
    .admin-drawer-body {
      flex: 1;
      overflow-y: auto;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .admin-section {
      display: none;
      flex-direction: column;
      gap: 1rem;
    }

    .admin-section.active {
      display: flex;
    }

    /* كروت الإحصائيات وبطاقات المستخدمين */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
    }

    .stat-card {
      background: var(--bg-main);
      border: 1px solid var(--border-color);
      padding: 1rem;
      border-radius: var(--radius-md);
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .stat-card-title {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .stat-card-val {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--text-main);
    }

    .user-card, .deposit-card, .method-card {
      background: var(--bg-main);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .status-badge {
      display: inline-block;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .status-pending { background: rgba(245, 158, 11, 0.15); color: var(--warning); }
    .status-approved { background: rgba(16, 185, 129, 0.15); color: var(--success); }
    .status-rejected { background: rgba(239, 68, 68, 0.15); color: var(--danger); }
  </style>
</head>
<body>

  <!-- شريط التنقل العلوي -->
  <header>
    <div class="nav-container">
      <!-- شعار واسم المتجر -->
      <div class="brand-section" onclick="location.reload()">
        <div class="brand-logo" id="siteLogoHeader">
          <i class="fa-solid fa-bolt"></i>
        </div>
        <div class="brand-info">
          <h1 id="siteTitleHeader">مركز مهند للتكنولوجيا</h1>
          <span>خدمات الشحن الفوري والبطاقات الرقمية</span>
        </div>
      </div>

      <!-- الأزرار والرصيد وبيانات المستخدم -->
      <div class="nav-actions">
        <!-- رصيد المستخدم (يظهر بعد تسجيل الدخول) -->
        <div class="balance-badge" id="userBalanceBadge" style="display: none;">
          <i class="fa-solid fa-wallet"></i>
          <span id="userBalanceVal">$0.00</span>
        </div>

        <!-- زر تبديل الوضع الليلي / الفاتح -->
        <button class="action-btn" id="themeToggleBtn" title="تبديل المظهر">
          <i class="fa-solid fa-moon"></i>
        </button>

        <!-- زر طلب إيداع رصيد -->
        <button class="action-btn" id="depositOpenBtn" title="طلب إيداع رصيد" style="display: none;">
          <i class="fa-solid fa-circle-plus"></i>
        </button>

        <!-- زر لوحة الإدارة (يظهر فقط لحساب المدير) -->
        <button class="action-btn" id="adminPanelOpenBtn" title="لوحة تحكم الإدارة" style="display: none; background: rgba(37, 99, 235, 0.2); border-color: var(--primary);">
          <i class="fa-solid fa-screwdriver-wrench" style="color: #60a5fa;"></i>
        </button>

        <!-- زر الحساب وتسجيل الدخول / الخروج -->
        <button class="action-btn" id="authActionBtn" title="تسجيل الدخول">
          <i class="fa-solid fa-user"></i>
        </button>
      </div>
    </div>
  </header>
