<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة رصيد - متجر مهند</title>
    <!-- استدعاء ملف التنسيقات الخارجي -->
    <link rel="stylesheet" href="style.css">
    <!-- خط كاهيرو للاستيليشن الجميل -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="deposit-container">
        <h2>إضافة رصيد</h2>
        
        <div class="payment-grid">
            <!-- خيار 1: كود الهدية -->
            <div class="payment-card">
                <div class="icon-box">🎁</div>
                <span>كود الهدية</span>
            </div>

            <!-- خيار 2: سيريتل كاش -->
            <div class="payment-card">
                <div class="icon-box">📱</div>
                <span>سيريتل كاش</span>
            </div>

            <!-- خيار 3: شام كاش -->
            <div class="payment-card">
                <div class="icon-box">💎</div>
                <span>شام كاش أوتوماتيك</span>
            </div>

            <!-- خيار 4: حوالات الهرم -->
            <div class="payment-card">
                <div class="icon-box">🏛️</div>
                <span>حوالات الهرم</span>
            </div>

            <!-- خيار 5: حوالات الفؤاد -->
            <div class="payment-card">
                <div class="icon-box">📜</div>
                <span>حوالات الفؤاد</span>
            </div>

            <!-- خيار 6: USDT -->
            <div class="payment-card">
                <div class="icon-box">🪙</div>
                <span>USDT BEP20</span>
            </div>

            <!-- خيار 7: زين كاش -->
            <div class="payment-card">
                <div class="icon-box">💳</div>
                <span>زين كاش العراق</span>
            </div>

            <!-- خيار 8: بنك تركي -->
            <div class="payment-card">
                <div class="icon-box">🇹🇷</div>
                <span>زراعات بنك تركي</span>
            </div>
        </div>
    </div>

</body>
</html>
